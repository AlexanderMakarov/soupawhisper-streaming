[whisper]
# Model: tiny, base, small, medium, large-v3 (multilingual) or tiny.en, base.en, small.en, medium.en (English only)
model = base

# Device: cpu or cuda (cuda requires cuDNN)
device = cpu

# Compute type: int8 for CPU, float16 for GPU
compute_type = int8

# Language: en, es, ru, auto (auto = detect language automatically; needs a model without .en)
language = auto

# When language = auto: optional comma-separated ISO codes to restrict detection (e.g. only English and Russian).
# Parakeet: decodes in each listed language's alphabet and keeps the most confident
# result, so set this for mixed-language meetings (e.g. en, ru). Languages that share
# an alphabet (en, de) can't be told apart; Parakeet still writes each in its own words.
# Whisper still scores all languages internally; we pick the highest-probability code in this list.
# Helps avoid wrong-language typing on short or noisy audio (e.g. subscription forms).
# language_allowlist = en, ru

[input]
# Audio input device: device index (e.g., 0, 8) or partial device name (e.g., "pulse", "HDA Intel").
# Leave empty to use default device. Run with --verbose to see available devices.
# audio_input_device =

[hotkey]
# Key to hold for recording: F12, scroll_lock, pause, etc.
key = f12

[behavior]
# If streaming is enabled by default.
default_streaming = true

# Show desktop notification
notifications = true

# Menu bar (macOS) / system tray (Linux) status icon. Default on.
# If true and no tray host / AppIndicator bindings are available for this Python, SoupaWhisper exits.
# Linux: needs StatusNotifier host + gi/AppIndicator for the same interpreter (see README).
# Distro Python + apt python3-gi is easiest; uv/standalone Pythons need PyGObject from source
# or a third-party repo that matches that Python. Without a GUI tray, set tray_icon = false.
tray_icon = true
# Show EN/RU/AUTO beside the icon on AppIndicator (Linux) / menu bar title (macOS),
# and in the tooltip. Session language from layout wins over config when set.
tray_show_language = true

# Copy resulting text to clipboard
clipboard = true

# Type text into active input field
auto_type = true

# Automatically format text as sentence: capitalize first letter and add period at end
auto_sentence = true

# Delay between typing characters in seconds. Make bigger to visualize the typing process.
typing_delay = 0.01

# Save recordings to /tmp with timestamped filenames (disable automatic deletion)
save_recordings = false

# Desktop toast when the microphone delivers silence ("No audio detected - check device").
# On by default, but at most once per dictation session (streaming pauses would otherwise stack banners).
# Always logged at WARNING. Set false to suppress the toast.
notify_no_audio = true

# Streaming-only: suppress specific hallucinated/noise phrases.
# If set, any *streaming chunk* that equals one of these phrases (punctuation ignored) is skipped
# (not typed, not added to clipboard output). Multiple phrases in one chunk are NOT rejected.
reject_phrases = thank you, thanks, okay, ok, um, hmm

# Optional: comma-separated custom terms / glossary that Whisper should prefer.
# Improves recognition of names, brands, technical terms, acronyms, multi-word
# phrases, etc. Passed to faster-whisper as both initial_prompt (in-context
# priming) and hotwords (decoder logit bias). Applies to streaming and
# non-streaming modes. Leave empty to disable. Note: this is a *hint*, not a
# guarantee — strongly mismatched audio may still produce other words.
# Fully effective with Whisper models only: Parakeet has no prompt and gets
# a weaker per-token nudge toward these terms.
# custom_terms = Claude, Kubernetes, GraphQL, ML repository

# When [whisper].language=auto, enforce language from current keyboard layout (captured once on start).
# Parakeet models always use the layout language in dictation, whatever this says.
# Meetings never use the layout: they detect the language per speech run.
# Unmapped or unreadable layouts fall back to automatic detection.
enforce_language_from_layout = true
# Map layout ids that are not language codes (us is a country, not a language). Add your other layouts, e.g. com.apple.keylayout.Russian:ru
layout_to_language = us:en, com.apple.keylayout.US:en

# --- Model switching ----------------------------------------------------------
# Lists the models offered in the tray. Picking one there applies without a restart;
# changes to this file need one.
# Format: <label>:<engine>:<model>, <label>:<engine>:<model>
#   label   text shown in the menu (no ":" or ",")
#   engine  whisper or parakeet
#   model   whisper: anything Whisper accepts: size name, Hugging Face repo, or local path
#           parakeet: nemo-parakeet-tdt-0.6b-v3, or a local folder with its ONNX files
# When `models` is set, dictation_model and meeting_model are required (they are
# labels from the list, used at startup) and [whisper] model is ignored.
# A mistake here stops the app with a notification saying what is wrong.
#
# Only the active dictation model is downloaded at startup. Picking a model in the
# tray downloads it; a meeting model stays out of memory until a meeting is transcribed.
# English-only models (such as base.en) always use English. For multilingual models,
# set [whisper] language = auto; language = en keeps them in English.
#
# models = English fast:whisper:base.en, Multi-language:whisper:small, Parakeet:parakeet:nemo-parakeet-tdt-0.6b-v3
# dictation_model = English fast
# meeting_model = Multi-language

[parakeet]
# How strictly a Parakeet model keeps text in the alphabet of the language it
# decodes in (from the layout, [whisper] language, or detection). Per language:
# <lang>:ban (never other alphabets) or <lang>:<number> (a score penalty: other
# alphabets win only on clear audio; 0 = no restriction). "*" covers languages not
# listed. Entries override the defaults one language at a time. Default: ban, except
# a soft 3 for Russian, Ukrainian and Bulgarian, so English terms in their speech
# stay in Latin, while accented English never comes out in Cyrillic.
# script_penalty = *:ban, ru:3, uk:3, bg:3

[streaming]
# Recent accepted words to supply as context for the next chunk. 0 disables text context.
# Whisper only: Parakeet decodes each chunk on its own.
context_words = 50

# Clear recent text after this many seconds without speech; 0 resets before every chunk.
# This uses captured speech timestamps, not decoder processing time. The glossary remains active.
context_reset_seconds = 10.0

# Minimum speech length in seconds required to finalize a speech chunk.
min_speech_length_seconds = 1.0

# Silence duration in seconds required to finalize a speech chunk.
vad_silence_threshold_seconds = 0.5

# Sample rate for streaming audio and VAD (should match Whisper model, 16000 Hz recommended).
vad_sample_rate = 16000

# Size of audio chunks for SAD analysis in milliseconds. Only 10, 20, 30 are supported for now.
vad_chunk_size_ms = 20

# Minimum number of consecutive speech chunks with detected speech required to ensure speech is active.
vad_min_speech_chunks = 10

# VAD aggressiveness threshold (0.0-3.0, lower = more sensitive).
vad_threshold = 1.0

[meeting]
# Meeting recording mode. Captures TWO tracks -- your mic and everything the speakers
# play (everyone else) -- then transcribes both after you stop and merges them into
# one speaker-labelled Markdown transcript. Needs PipeWire (Linux).
#
# IMPORTANT: use headphones. On open speakers your mic also picks up the other
# participants, so their words land on BOTH tracks and appear under "Me" as well.
#
# Meeting mode and dictation are mutually exclusive: while a meeting records, the
# dictation hotkey does nothing, so transcribed text can never be typed into the call.
#
# Glossary and reject_phrases come from [behavior] and apply to meetings too.
#
# To tune anything below: set keep_audio = true, record a sample, then re-run the
# same WAVs with different values and compare. transcribe.log lists every speech run
# with its offset, duration and detected language.

# Where merged transcripts are kept (created if missing). These are never deleted.
transcript_dir = ~/Documents/meetings

# Hard stop, in minutes, so a forgotten recording cannot run all day (~230 MB/hour).
max_duration_min = 120

# Auto-stop after this many minutes with no speech on EITHER track. 0 disables it.
silence_stop_min = 10

# Optional global combo to start/stop a meeting, e.g. "shift+f12". Empty = tray only.
# Deliberately a combo so it cannot be hit by accident mid-call.
hotkey =

# Threads for the meeting model (default: half the logical cores). Meeting
# transcription uses its own model instance, so dictation stays usable while it runs.
# More is not faster past this point: oversubscribing slows it down.
# cpu_threads = 4

# Keep the WAVs after a successful transcript (default false, ~230 MB/hour).
# Turn on to re-run a bad transcript with different settings.
# keep_audio = false

# --- Speech detection ---------------------------------------------------------
# Each track is cut into speech runs. Uncertain language detection automatically
# uses nearby same-track speech; confident per-run language switches are preserved.
# Silence between runs is never transcribed. No context configuration is required.

# Pause length, in ms, that ends a run. Lower splits speech more finely and lets the
# language switch more often; higher keeps a sentence's own pauses in one run.
# run_min_silence_ms = 1200

# Audio kept either side of a run, in ms, so the first and last words are not clipped.
# run_pad_ms = 200

# How confidently a frame must sound like speech, 0.0-1.0. Lower catches quiet talk
# but lets noise through; higher keeps only clear speech.
# run_vad_threshold = 0.5

# Ignore runs shorter than this many ms. Raise it if coughs or clicks become runs.
# run_min_speech_ms = 0

# Split runs longer than this many seconds, so a long monologue can change language.
# run_max_seconds = 30

# Drop transcribed text the model was unsure about, by its average log probability.
# Calibrated for Whisper; Parakeet scores sit near -0.1 and are not dropped by default.
# Raise toward -1.0 to cut more invented text; lower toward -2.0 if short real words
# go missing. Dropped segments are counted in transcribe.log.
# min_avg_logprob = -1.5

# --- Transcript shape ---------------------------------------------------------

# How many seconds one speaker may talk before the transcript starts a new block with
# a fresh timestamp. Lower for finer timestamps, higher to keep a long answer whole.
# me_max_block_seconds = 60

# Same cap for the other side. Lower by default because that track may carry several
# people, so frequent timestamps are what keeps their turns apart.
# them_max_block_seconds = 20

# Every transcript already opens with frontmatter holding speaking ratio, words per
# minute and think time for both sides. For finer analysis, also write
# <track>.words.json with per-word start/end times, for measuring pauses,
# response latency and speaking rate. Costs extra transcription time and does not
# change the .srt or .md output.
# word_timestamps = false
